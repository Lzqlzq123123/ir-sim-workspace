# 自动驾驶训练环境配置
# 环境范围: 37m x 20m 的矩形区域
# 起点: (2, 10), 终点: (35, 10)
# 障碍物包括挡路的，需要学会避障并到达目标

world:
  height: 20
  width: 37
  step_time: 0.1
  sample_time: 0.1
  offset: [0, 0]
  collision_mode: 'stop'
  control_mode: 'auto'
  plot:
    reward:
      obstacle_penalty_distance: 3
      obstacle_danger_distance: 1

robot:
  - kinematics: {name: 'acker'}
    shape: {name: 'rectangle', length: 4.2, width: 2.43, wheelbase: 1.75}
    state: [2, 10, 0, 0]
    goal: [35, 10, 0]
    vel_min: [0, -1]
    vel_max: [3, 1]
    goal_threshold: 1.0
    plot:
      show_trail: True
      show_goal: False
    sensors:
      - type: 'lidar2d'
        range_min: 0
        range_max: 20
        angle_range: 3.1415926
        number: 100
        noise: False

obstacle:
  # 边界墙壁
  - number: 1
    distribution: {name: 'manual'}
    shape:
      - {name: 'rectangle', length: 37, width: 0.5}
    state:
      - [18.5, 0, 0]

  - number: 1
    distribution: {name: 'manual'}
    shape:
      - {name: 'rectangle', length: 37, width: 0.5}
    state:
      - [18.5, 20, 0]

  - number: 1
    distribution: {name: 'manual'}
    shape:
      - {name: 'rectangle', length: 0.5, width: 20}
    state:
      - [0, 10, 0]

  - number: 1
    distribution: {name: 'manual'}
    shape:
      - {name: 'rectangle', length: 0.5, width: 20}
    state:
      - [37, 10, 0]

  # 圆形障碍物 - 包括挡路的
  - number: 4
    distribution: {name: 'manual'}
    state: [[10, 4], [15, 10], [24, 7], [20, 18]]
    shape:
      - {name: 'circle', radius: 1.2}
