# 自动驾驶训练环境配置
# 环境范围: x[-950,-935], y[500,600]
# 起终点由CSV轨迹首尾自动对齐

world:
  height: 100
  width: 15
  step_time: 0.1
  sample_time: 0.1
  offset: [-950, 500]
  collision_mode: 'stop'
  control_mode: 'auto'
  plot:
    viewpoint: 'robot_0'   # 视角跟随机器人，不再固定在(0,0)

gui:
  # 每回合随机化配置（训练环境读取）：随机起终点和障碍物
  randomization:
    enabled: false                  # 是否每回合随机起终点与障碍物
    randomize_obstacles: true      # 是否随机化圆形障碍物
    min_start_goal_distance: 10.0  # 起点终点最小间距（米）
    random_margin: 1.5             # 采样时离边界最小距离（米）
    max_sampling_attempts: 200     # 每回合最大采样尝试次数
  obstacle_avoidance:
    min_distance: 6              # min_distance <  时开始避障惩罚
    danger_distance: 4.7          # min_distance <  时追加危险惩罚
  # 全局路径配置（planning训练读取，CSV-only）
  global_path: 
    csv_path: "/data/lzq/model_train/deploy/local_trajectory_20260330_154751.csv"  # 必填；可填绝对路径或相对 workspace 的路径
    delimiter: ","
    x_col: "x"
    y_col: "y"
    yaw_col: "yaw"               # CSV无该列时会由轨迹点自动估计
    speed_col: "speed"           # CSV无该列时使用 target_velocity

robot:
  - kinematics: {name: 'acker'}
    shape: {name: 'rectangle', length: 4.2, width: 2.43, wheelbase: 1.75}
    state: [0, 0, 0, 0]          # 占位；reset时会自动对齐到CSV首点
    goal: [0, 0, 0]              # 占位；reset时会自动对齐到CSV末点
    vel_min: [0, -1]
    vel_max: [3, 1]
    goal_threshold: 1.0
    plot:
      show_trail: True
      show_goal: False
    sensors:
      - type: 'lidar2d'
        range_min: 0
        range_max: 20
        angle_range: 3.1415926
        number: 100
        noise: False

obstacle:
  # 围墙：x[-950,-935], y[500,600]
  - number: 1
    distribution: {name: 'manual'}
    shape:
      - {name: 'rectangle', length: 40.0, width: 0.5}
    state:
      - [-950.5, 500.0, 0.0]   # 下边界

  - number: 1
    distribution: {name: 'manual'}
    shape:
      - {name: 'rectangle', length: 40.0, width: 0.5}
    state:
      - [-920, 600.0, 0.0]   # 上边界

  - number: 1
    distribution: {name: 'manual'}
    shape:
      - {name: 'rectangle', length: 0.5, width: 100.0}
    state:
      - [-950.0, 550.0, 0.0]   # 左边界

  - number: 1
    distribution: {name: 'manual'}
    shape:
      - {name: 'rectangle', length: 0.5, width: 100.0}
    state:
      - [-930.0, 550.0, 0.0]   # 右边界

  # 轨迹上固定障碍物（可按需调整位置和大小）
  - number: 1
    distribution: {name: 'manual'}
    state:
      - [-940.22, 522.62]   # 放到轨迹中段，避免与起点重叠导致开局碰撞
    shape:
      - {name: 'circle', radius: 0.8}



